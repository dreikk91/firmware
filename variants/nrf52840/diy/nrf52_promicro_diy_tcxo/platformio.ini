; Promicro + E22(0)-xxxM / HT-RA62 modules board variant - DIY - with TCXO
[env:nrf52_promicro_diy_tcxo]
custom_meshtastic_hw_model = 63
custom_meshtastic_hw_model_slug = NRF52_PROMICRO_DIY
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = NRF52 Pro-micro DIY
custom_meshtastic_images = promicro.svg
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board_level = release
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
  -D EXCLUDE_EMOJI ; this variant builds 4 radio driver families and is the largest nrf52 image; emote bitmaps don't fit under the 0xEA000 warm-store cap
  ; -D RADIOLIB_GODMODE=1 ; needed for some LR2021 items, but not enabled by default.
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink

[env:nrf52_promicro_diy_tcxo-bridge]
extends = env:nrf52_promicro_diy_tcxo
build_flags =
  ${env:nrf52_promicro_diy_tcxo.build_flags}
  -D MESHTASTIC_UART_BRIDGE=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -D UART_BRIDGE_RX=6
  -D UART_BRIDGE_TX=8
  -D UART_BRIDGE_CHANNEL=0

[env:nrf52_promicro_diy_tcxo-bridge-full]
extends = env:nrf52_promicro_diy_tcxo-bridge
build_flags =
  ${env:nrf52_promicro_diy_tcxo-bridge.build_flags}
  -D UART_BRIDGE_FULL=1

[env:nrf52_promicro_diy_tcxo-bridge-full-weact213]
extends = env:nrf52_promicro_diy_tcxo-bridge-full, inkhud
build_flags =
  ${env:nrf52_promicro_diy_tcxo-bridge-full.build_flags}
  ${inkhud.build_flags}
  -D INKHUD_BUILDCONF_DRIVER=HINK_E0213A289
  -D INKHUD_BUILDCONF_DISPLAYRESILIENCE=10
  -D UART_BRIDGE_INKHUD_CYRILLIC=1
build_src_filter =
  ${env:nrf52_promicro_diy_tcxo.build_src_filter}
  ${inkhud.build_src_filter}
lib_deps =
  ${inkhud.lib_deps}
  ${nrf52840_base.lib_deps}

; NRF52 ProMicro w/ E-Ink display
[env:nrf52_promicro_diy-inkhud]
board_level = extra
extends = nrf52840_base, inkhud
board = promicro-nrf52840
build_flags =
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
extra_scripts =
  ${nrf52840_base.extra_scripts}
  variants/nrf52840/diy/nrf52_promicro_diy_tcxo/custom_build_tasks.py ; Add to PIO's Project Tasks pane: preset builds for common displays


; NRF52 ProMicro w/ EasyProMicro pinout
[env:nrf52_promicro_diy-easypromicro]
board_level = extra
extends = nrf52840_base
board = promicro-nrf52840
build_flags =
  ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
  -D EASYPROMICRO ; For EasyProMicro pinout (instead of ProMicro pinout)
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink
