; Hydra - Meshtastic DIY v1 hardware with some specific changes
[env:hydra]
custom_meshtastic_hw_model = 39
custom_meshtastic_hw_model_slug = HYDRA
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Hydra
custom_meshtastic_tags = DIY

extends = esp32_base
board = esp32doit-devkit-v1
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -I variants/esp32/diy/hydra

[env:meshadventurer-bridge]
extends = env:hydra
build_flags =
  ${env:hydra.build_flags}
  -D MESHTASTIC_UART_BRIDGE=1
  -D TCXO_OPTIONAL
  -D SX126X_DIO3_TCXO_VOLTAGE=2.2
  -D SERIAL_PRINT_PORT=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D UART_BRIDGE_RX=34
  -D UART_BRIDGE_TX=25
  -D UART_BRIDGE_CHANNEL=0

[env:meshadventurer-bridge-full]
extends = env:meshadventurer-bridge
build_flags =
  ${env:meshadventurer-bridge.build_flags}
  -D UART_BRIDGE_FULL=1
